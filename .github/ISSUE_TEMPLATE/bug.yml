name: Bug report
description: Something in the app does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For example "Safari on iPhone 15".
  - type: markdown
    attributes:
      value: "**Do not paste your food or symptom log here.** Issues are public."
